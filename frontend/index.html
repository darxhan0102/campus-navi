<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#226192">
  <title>Campus Navi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --ivory: #EAE6DE;
      --ivory-light: #F6F3EC;
      --blue: #226192;
      --blue-dark: #174a73;
      --coral: #EF8557;
      --coral-dark: #DD6F3F;
      --ink: #15283a;
      --muted: #5f6d79;
      --line: rgba(34, 97, 146, 0.18);
      --shadow: 0 8px 24px rgba(23, 74, 115, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 20px 48px;
      background: var(--ivory);
      color: var(--ink);
    }

    /* Header banner */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin: 20px 0 22px;
      padding: 26px 28px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--blue) 0%, #1b4f78 100%);
      color: var(--ivory);
      border-bottom: 4px solid var(--coral);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand svg {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }

    .hero h1 {
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.3px;
    }

    .hero p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.85;
      letter-spacing: 0.4px;
    }

    .navLink {
      background: var(--coral);
      color: var(--ink);
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.15s, transform 0.15s;
    }

    .navLink:hover {
      background: var(--coral-dark);
      transform: translateY(-1px);
    }

    /* Cards */
    .card {
      background: var(--ivory-light);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .field {
      flex: 1;
      min-width: 200px;
    }

    label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--blue);
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    select {
      width: 100%;
      padding: 11px 12px;
      font-size: 15px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #FBF9F5;
      font-family: inherit;
    }

    select:focus {
      outline: 2px solid var(--coral);
      outline-offset: 1px;
    }

    button#routeBtn {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      background: var(--blue);
      color: var(--ivory);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.15s;
      box-shadow: 0 4px 0 var(--coral);
    }

    button#routeBtn:hover {
      background: var(--blue-dark);
    }

    button#routeBtn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--coral);
    }

    #result {
      padding: 14px 18px;
      background: rgba(239, 133, 87, 0.12);
      border-left: 4px solid var(--coral);
      border-radius: 10px;
      margin-top: 18px;
      font-size: 14px;
      display: none;
      line-height: 1.6;
    }

    #result.show {
      display: block;
    }

    #result b {
      color: var(--blue);
    }

    /* Map */
    .mapCard {
      padding: 8px;
      position: relative;
    }

    #map {
      height: 480px;
      border-radius: 12px;
      overflow: hidden;
      cursor: default;
    }

    #map .leaflet-tile-pane {
      filter: sepia(0.2) saturate(0.95) contrast(1.02);
    }

    #map.editing {
      cursor: crosshair;
    }

    #map.editing .leaflet-interactive {
      pointer-events: none;
      cursor: crosshair;
    }

    .leaflet-bar a {
      color: var(--blue);
    }

    .leaflet-tooltip {
      background: var(--blue);
      color: var(--ivory);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .leaflet-tooltip-top:before {
      border-top-color: var(--blue);
    }

    .leaflet-tooltip-bottom:before {
      border-bottom-color: var(--blue);
    }

    .leaflet-tooltip-left:before {
      border-left-color: var(--blue);
    }

    .leaflet-tooltip-right:before {
      border-right-color: var(--blue);
    }

    .editBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 6px 14px;
    }

    .editBar span {
      font-size: 13px;
      color: var(--muted);
    }

    #editToggle {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 999px;
      border: 1.5px solid var(--blue);
      background: transparent;
      color: var(--blue);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    #editToggle.on {
      background: var(--coral);
      border-color: var(--coral);
      color: var(--ink);
    }

    #coordPanel {
      display: none;
      margin-top: 4px;
      padding: 14px;
      background: #12293c;
      border-radius: 12px;
    }

    #coordPanel.show {
      display: block;
    }

    #coordLog {
      font-family: 'Consolas', monospace;
      font-size: 12.5px;
      color: var(--ivory);
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .coordActions {
      display: flex;
      gap: 8px;
    }

    .coordActions button {
      flex: 1;
      padding: 8px;
      font-size: 12.5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
    }

    #copyBtn {
      background: var(--coral);
      color: var(--ink);
    }

    #clearBtn {
      background: var(--blue);
      color: var(--ivory);
    }

    /* Phone layout */
    @media (max-width: 600px) {
      body {
        padding: 0 12px 36px;
      }

      .hero {
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
        margin: 14px 0 16px;
        border-radius: 16px;
      }

      .hero h1 {
        font-size: 24px;
      }

      .brand svg {
        width: 40px;
        height: 40px;
      }

      .navLink {
        align-self: stretch;
        text-align: center;
      }

      .card {
        padding: 16px;
        margin-bottom: 16px;
        border-radius: 16px;
      }

      .row {
        flex-direction: column;
        gap: 12px;
      }

      .field {
        min-width: 0;
      }

      select {
        font-size: 16px;
        padding: 12px;
      }

      button#routeBtn {
        padding: 15px;
        font-size: 16px;
      }

      #map {
        height: 60vh;
        min-height: 320px;
      }

      .editBar {
        flex-direction: column;
        align-items: stretch;
      }

      #editToggle {
        width: 100%;
        padding: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="20" fill="none" stroke="#EAE6DE" stroke-width="2.5" stroke-dasharray="100 26"
          stroke-linecap="round" />
        <path d="M33 13 L14 22 L23 25 L26 34 Z" fill="#EF8557" />
      </svg>
      <div>
        <h1>Campus Navi</h1>
        <p>Find your way across the JAIN Global Campus</p>
      </div>
    </div>
    <a class="navLink" href="floor-guide.html">Inside FET — Floor Guide →</a>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>From</label>
        <select id="fromSelect"></select>
      </div>
      <div class="field">
        <label>To</label>
        <select id="toSelect"></select>
      </div>
    </div>
    <button id="routeBtn" onclick="findRoute()">Find Route</button>
    <div id="result"></div>
  </div>

  <div class="card mapCard">
    <div id="map"></div>
    <div class="editBar">
      <span>Need coordinates for a new route? Click along a road to record points.</span>
      <button id="editToggle" onclick="toggleEditMode()">Edit Routes</button>
    </div>
    <div id="coordPanel">
      <div id="coordLog">Click on the map to record a point...</div>
      <div class="coordActions">
        <button id="copyBtn" onclick="copyPoints()">Copy Points</button>
        <button id="clearBtn" onclick="clearPoints()">Clear</button>
      </div>
    </div>
  </div>

    let markerLayer = L.layerGroup().addTo(map);
    let routeMarkers = L.layerGroup().addTo(map);
    let routeLine = null;
    let routeCasing = null;
    let editMode = false;
    let pickedPoints = [];

    function toggleEditMode() {
      editMode = !editMode;
      document.getElementById("editToggle").classList.toggle("on", editMode);
      document.getElementById("map").classList.toggle("editing", editMode);
      document.getElementById("coordPanel").classList.toggle("show", editMode);
    }

    function clearPoints() {
      pickedPoints = [];
      document.getElementById("coordLog").textContent = "Click on the map to record a point...";
    }

    function copyPoints() {
      const text = pickedPoints.join(",\n");
      navigator.clipboard.writeText(text);
    }

    map.on('click', (e) => {
      if (!editMode) return;
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);
      pickedPoints.push(`[${lat}, ${lng}]`);
      document.getElementById("coordLog").textContent = pickedPoints.join(",\n");
    });

    function getSegment(fromId, toId) {
      const forward = edgeWaypoints[`${fromId}-${toId}`];
      const backward = edgeWaypoints[`${toId}-${fromId}`];

      if (forward) return forward;
      if (backward) return [...backward].reverse();

      const a = nodeCoords[fromId], b = nodeCoords[toId];
      return a && b ? [[a.lat, a.lng], [b.lat, b.lng]] : [];
    }

    async function loadLocations() {
      const res = await fetch(`${API}/locations`);
      const nodes = await res.json();

      const fromSelect = document.getElementById("fromSelect");
      const toSelect = document.getElementById("toSelect");

      nodes.forEach(node => {
        fromSelect.add(new Option(node.name, node.id));
        toSelect.add(new Option(node.name, node.id));

        const coord = nodeCoords[node.id];
        if (coord) {
          L.circleMarker([coord.lat, coord.lng], {
            radius: 4,
            color: '#EAE6DE',
            weight: 1.5,
            fillColor: '#226192',
            fillOpacity: 1
          }).addTo(markerLayer).bindTooltip(node.name);
        }
      });
    }

    async function findRoute() {
      const from = document.getElementById("fromSelect").value;
      const to = document.getElementById("toSelect").value;

      const res = await fetch(`${API}/route?from=${from}&to=${to}`);
      const data = await res.json();

      const resultDiv = document.getElementById("result");

      if (data.error) {
        resultDiv.innerHTML = `${data.error}`;
        resultDiv.classList.add("show");
        return;
      }

      resultDiv.innerHTML = `
        <div><b>Route:</b> ${data.path.join(" → ")}</div>
        <div><b>Distance:</b> ${data.distance} meters</div>
      `;
      resultDiv.classList.add("show");

      let fullLine = [];
      for (let i = 0; i < data.path.length - 1; i++) {
        fullLine = fullLine.concat(getSegment(data.path[i], data.path[i + 1]));
      }

      if (routeCasing) map.removeLayer(routeCasing);
      if (routeLine) map.removeLayer(routeLine);
      routeMarkers.clearLayers();

      routeCasing = L.polyline(fullLine, {
        color: '#226192', weight: 8, opacity: 0.9, lineCap: 'round', lineJoin: 'round'
      }).addTo(map);
      routeLine = L.polyline(fullLine, {
        color: '#EF8557', weight: 4, lineCap: 'round', lineJoin: 'round'
      }).addTo(map);

      if (fullLine.length > 0) {
        L.circleMarker(fullLine[0], {
          radius: 7, color: '#226192', weight: 3, fillColor: '#EAE6DE', fillOpacity: 1
        }).addTo(routeMarkers);
        L.circleMarker(fullLine[fullLine.length - 1], {
          radius: 7, color: '#226192', weight: 3, fillColor: '#EF8557', fillOpacity: 1
        }).addTo(routeMarkers);
      }

      map.fitBounds(routeLine.getBounds());
    }

    loadLocations();
  </script>
